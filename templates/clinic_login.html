<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinic Administrator Login - MEDIAI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        body{
            background:#eef7f3;
            font-family:Arial, sans-serif;
        }

        .login-container{
            width:420px;
            margin:auto;
            margin-top:70px;
        }

        .back-link{
            text-decoration:none;
            color:#555;
            font-size:13px;
            margin-bottom:15px;
            display:inline-block;
        }

        .login-card{
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        .icon-circle{
            width:55px;
            height:55px;
            background:#198754;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            color:white;
            font-size:22px;
            margin-bottom:15px;
        }

        h3{
            text-align:center;
            font-weight:700;
            margin-bottom:5px;
            color:#111;
        }

        .subtitle{
            text-align:center;
            color:#777;
            font-size:14px;
            margin-bottom:25px;
        }

        .form-label{
            font-size:14px;
            font-weight:600;
        }

        .form-control{
            border-radius:8px;
            padding:10px;
            font-size:14px;
        }

        .btn-login{
            background:#198754;
            color:white;
            border:none;
            width:100%;
            padding:10px;
            border-radius:8px;
            font-weight:600;
            margin-top:15px;
        }

        .btn-login:hover{
            background:#146c43;
            color:white;
        }

    </style>
</head>

<body>

<div class="login-container">

    <a href="/" class="back-link">
        ← Back to Home
    </a>

    <div class="login-card">

        <div class="icon-circle">
            <i class="fa-solid fa-hospital"></i>
        </div>

        <h3>Clinic Administrator Login</h3>

        <div class="subtitle">
            Access clinic management dashboard
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <!-- USERNAME -->
            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                name="username"
                class="form-control"
                placeholder="Enter administrator username"
                required>

            </div>

            <!-- PASSWORD -->
            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <input type="password"
                    id="adminPassword"
                    name="password"
                    class="form-control"
                    placeholder="Enter administrator password"
                    required>

                    <span class="input-group-text"
                    onclick="togglePassword()"
                    style="cursor:pointer;">

                        <i class="fa-solid fa-eye"
                        id="passwordEye"></i>

                    </span>

                </div>

            </div>

            <button type="submit" class="btn-login">
                Login
            </button>

        </form>

    </div>

</div>

<script>

function togglePassword(){

    let password =
    document.getElementById("adminPassword");

    let eye =
    document.getElementById("passwordEye");

    if(password.type === "password"){

        password.type = "text";

        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");

    }
    else{

        password.type = "password";

        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");

    }

}

</script>

</body>
</html>
