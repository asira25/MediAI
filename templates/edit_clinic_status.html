<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Edit Clinic Status</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.page-title{
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-body p-4">

<h2 class="page-title">

Edit Clinic Status

</h2>

<hr>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Clinic Name

</label>

<input
type="text"
class="form-control"
value="{{ clinic.clinic_name }}"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Clinic Status

</label>

<select
name="status"
class="form-select"
required>

<option value="Open"
{% if clinic.status=="Open" %}selected{% endif %}>

Open

</option>

<option value="Temporary Closed"
{% if clinic.status=="Temporary Closed" %}selected{% endif %}>

Temporary Closed

</option>

<option value="Permanently Closed"
{% if clinic.status=="Permanently Closed" %}selected{% endif %}>

Permanently Closed

</option>

</select>

</div>

<div class="alert alert-info">

<b>Open</b><br>
Clinic accepts appointments and operates normally.

<hr>

<b>Temporary Closed</b><br>
Clinic is temporarily unavailable due to maintenance, public holidays, or renovation.

<hr>

<b>Permanently Closed</b><br>
Clinic is no longer operating and cannot receive appointments.

</div>

<button
type="submit"
class="btn btn-primary">

Save Changes

</button>

<a href="{{ url_for('clinic_status') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>
</html>
