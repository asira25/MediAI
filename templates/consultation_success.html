
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultation Completed</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.checkmark{

    color:#16a34a;
}

.title{

.message{

    margin-top:10px;

.redirect{
    margin-top:20px;
    font-size:14px;
    color:#9ca3af;

<div class="success-card">

    <div class="checkmark">
        ✅
    </div>

    <div class="title">

    <div class="message">

        The consultation record and prescriptions
        have been saved successfully.

    </div>

    <div class="redirect">

<script>

setTimeout(function(){

    window.location.href =

}, 2000);
