
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consultation Completed</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

html,
body{
    min-height:100%;
}

body{
    margin:0;
    background:#f3f4f6;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

.success-main{
    box-sizing:border-box;
    width:100%;
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:56px 24px 72px;
}

.success-card{
    box-sizing:border-box;
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
    width:100%;
    max-width:500px;
}

.checkmark{
    font-size:80px;
    color:#16a34a;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin-top:15px;
}

.message{
    color:#6b7280;
    margin-top:10px;
}

.redirect{
    margin-top:20px;
    font-size:14px;
    color:#9ca3af;
}
.footer{
    box-sizing:border-box;
    width:100%;
    background:#1f3c88;
    color:white;
    padding:40px;
    flex-shrink:0;
}

@media (max-width: 576px){
    .success-main{
        align-items:flex-start;
        padding:32px 16px 48px;
    }

    .success-card{
        padding:36px 24px;
    }

    .checkmark{
        font-size:64px;
    }

    .title{
        font-size:26px;
    }

    .footer{
        padding:32px 24px;
    }
}
</style>

</head>

<body>

<main class="success-main">
<div class="success-card">

    <div class="checkmark">
        ✅
    </div>

    <div class="title">
        Consultation Completed
    </div>

    <div class="message">

        The consultation record and prescriptions
        have been saved successfully.

    </div>

    <div class="redirect">

        Redirecting to Doctor Dashboard...

    </div>

</div>
</main>

<script>

setTimeout(function(){

    window.location.href =
    "/doctor_dashboard";

}, 2000);

</script>


<!-- FOOTER -->
<div class="footer">
    <div class="row">
        <div class="col-md-6">
            <h5>About MEDIAI</h5>
            <p>Your trusted AI-powered healthcare management system.</p>
        </div>
        <div class="col-md-6">
            <h5>Contact</h5>
            <p>Email: info@mediai.com</p>
            <p>Phone: +60 3-1234 5678</p>
        </div>
    </div>
    <div class="text-center mt-3">
        © 2026 MEDIAI. All rights reserved.
    </div>
</div>


</body>

</html>
