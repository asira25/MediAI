<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Operating Hours Management - MediAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.page-title{
    font-weight:700;
    color:#0d6efd;
}

.table th{
    background:#0d6efd;
    color:white;
    text-align:center;
}

.table td{
    vertical-align:middle;
    text-align:center;
}

.badge{
    font-size:14px;
}

</style>

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="page-title">
                    Operating Hours Management
                </h2>

                <a href="{{ url_for('clinic_dashboard') }}"
                   class="btn btn-secondary">

                    Back

                </a>

            </div>

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th>Clinic Name</th>
                        <th>Opening Time</th>
                        <th>Closing Time</th>
                        <th>Operating Hours</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                {% for clinic in clinics %}

                    <tr>

                        <td>

                            {{ clinic.clinic_name }}

                        </td>

                        <td>

                            {{ clinic.opening_time_str }}

                        </td>

                        <td>

                            {{ clinic.closing_time_str }}

                        </td>

                        <td>

                            {{ clinic.opening_time_str }}

                            -

                            {{ clinic.closing_time_str }}

                        </td>

                        <td>

                            <a href="{{ url_for('edit_operating_hours', id=clinic.id) }}"
                               class="btn btn-primary btn-sm">

                                Edit Hours

                            </a>

                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
