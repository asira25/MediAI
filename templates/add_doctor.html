<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Add Doctor - MediAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
}

.card-box{
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.page-title{
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card-box">

<h2 class="page-title mb-4">

Add New Doctor

</h2>

<!-- Flash Message -->

{% with messages = get_flashed_messages() %}
{% if messages %}

{% for message in messages %}

<div class="alert alert-warning">

{{ message }}

</div>

{% endfor %}

{% endif %}
{% endwith %}

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Doctor Name

</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Clinic Code

</label>

<input
type="text"
name="clinic_code"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Specialist

</label>

<select
name="specialist"
class="form-select"
required>

<option value="">

Select Specialist

</option>

<option>Family Medicine</option>

<option>General Medicine</option>

<option>Cardiology</option>

<option>Dermatology</option>

<option>Neurology</option>

<option>Orthopedic</option>

<option>Respiratory Medicine</option>

<option>Gastroenterology</option>

</select>

</div>

<!-- Connected to Clinics Table -->

<div class="col-md-6 mb-3">

<label class="form-label">

Assigned Clinic

</label>

<select
name="clinic_id"
class="form-select"
required>

<option value="">

Select Clinic

</option>

{% for clinic in clinics %}

<option value="{{ clinic.id }}">

{{ clinic.clinic_name }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option value="Active">

Active

</option>

<option value="Inactive">

Inactive

</option>

</select>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Availability

</label>

<select
name="availability"
class="form-select">

<option value="Available">

Available

</option>

<option value="Unavailable">

Unavailable

</option>

<option value="On Leave">

On Leave

</option>

<option value="Retired">

Retired

</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Consultation Duration (Minutes)

</label>

<input
type="number"
name="consultation_duration"
class="form-control"
value="15"
min="5"
max="60"
required>

</div>

</div>

<div class="mt-3">

<button
type="submit"
class="btn btn-primary">

Save Doctor

</button>

<a
href="/doctor_management"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</body>
</html>
